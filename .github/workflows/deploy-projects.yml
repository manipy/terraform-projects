name: Deploy Terraform Projects

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Select project to deploy'
        required: true
        default: 'project1'
        type: choice
        options:
        - project1
        - project2
        - project3
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
        - plan
        - apply
        - destroy
      auto_approve:
        description: 'Auto-approve apply (skip manual approval)'
        required: false
        default: false
        type: boolean

env:
  TERRAFORM_VERSION: '1.5.0'
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  PROJECT_NAME: ${{ github.event.inputs.project }}

jobs:
  terraform:
    name: 'Deploy ${{ github.event.inputs.project }}'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_resource_group_name: ${{ secrets.TF_VAR_resource_group_name }}
      TF_VAR_resource_group_location: ${{ secrets.TF_VAR_resource_group_location }}
      TF_VAR_subnet_name: ${{ secrets.TF_VAR_subnet_name }}
      TF_VAR_vnet_name: ${{ secrets.TF_VAR_vnet_name }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_admin_username }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        cd "${{ env.PROJECT_NAME }}"
        terraform init \
          -backend-config="resource_group_name=${{ secrets.BACKEND_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ secrets.BACKEND_CONTAINER_NAME }}"

    - name: Terraform Format Check
      run: |
        cd "${{ env.PROJECT_NAME }}"
        terraform fmt -check

    - name: Terraform Validate
      run: |
        cd "${{ env.PROJECT_NAME }}"
        terraform validate

    - name: Terraform Plan
      run: |
        cd "${{ env.PROJECT_NAME }}"
        terraform plan -out=tfplan -parallelism=10

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'
      run: |
        cd "${{ env.PROJECT_NAME }}"
        if [ "${{ github.event.inputs.auto_approve }}" == "true" ]; then
          terraform apply -auto-approve tfplan
        else
          terraform apply tfplan
        fi

    - name: Terraform Output
      if: always()
      run: |
        cd "${{ env.PROJECT_NAME }}"
        terraform output -json > "../outputs-${{ env.PROJECT_NAME }}.json" || echo '{}' > "../outputs-${{ env.PROJECT_NAME }}.json"

    - name: Upload Terraform Outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: terraform-outputs
        path: "outputs-${{ env.PROJECT_NAME }}.json"
