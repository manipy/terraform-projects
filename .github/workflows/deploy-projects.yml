name: Deploy Terraform Projects

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Select project to deploy'
        required: true
        default: 'project1'
        type: choice
        options:
        - project1
        - project2
        - project3
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
        - plan
        - apply
        - destroy
      auto_approve:
        description: 'Auto-approve apply (skip manual approval)'
        required: false
        default: false
        type: boolean

env:
  TERRAFORM_VERSION: '1.5.0'
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  PROJECT_NAME: ${{ github.event.inputs.project }}

jobs:
  terraform:
    name: 'Deploy ${{ github.event.inputs.project }}'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Deploy Project
      run: |
        PROJECT_DIR="${{ env.PROJECT_NAME }}"
        echo "Deploying $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        
        terraform init \
          -backend-config="resource_group_name=${{ secrets.BACKEND_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ secrets.BACKEND_CONTAINER_NAME }}"
        
        terraform fmt -check
        terraform validate
        
        if [ "${{ github.event.inputs.action }}" == "plan" ]; then
          terraform plan -out=tfplan
        elif [ "${{ github.event.inputs.action }}" == "apply" ]; then
          terraform plan -out=tfplan
          if [ "${{ github.event.inputs.auto_approve }}" == "true" ]; then
            terraform apply -auto-approve tfplan
          else
            echo "Manual approval required for apply"
            terraform apply tfplan
          fi
        elif [ "${{ github.event.inputs.action }}" == "destroy" ]; then
          terraform plan -destroy -out=tfplan
          if [ "${{ github.event.inputs.auto_approve }}" == "true" ]; then
            terraform apply -auto-approve tfplan
          else
            echo "Manual approval required for destroy"
            terraform apply tfplan
          fi
        fi
        
        terraform output -json > "../outputs-${PROJECT_DIR}.json"

    - name: Upload Terraform Outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: terraform-outputs
        path: "outputs-${{ env.PROJECT_NAME }}.json"
